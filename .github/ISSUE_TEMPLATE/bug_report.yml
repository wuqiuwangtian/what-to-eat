name: 缺陷报告
description: 报告可复现的问题，请勿提交私人数据
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与预期行为
      description: 请使用合成餐食数据，不包含订单、地址或密钥。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 应用版本、安卓版本与机型
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
